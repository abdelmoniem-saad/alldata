# The public curriculum map, D1.
#
# This file is the source of truth for /syllabus (principle 7): the
# importer doesn't persist it, `GET /api/syllabus` resolves `topic:` slugs
# against the live DB at read time. A unit WITHOUT a `topic` is a declared
# part of the curriculum that has no lesson yet — shown honestly as
# "planned", never hidden, never dead-linked.
#
# Fields:
#   areas
#     - slug, stable id
#       title, area name as a learner would name it
#       description, one sentence on what the area is for
#       units, the ordered pieces of the area
#         - title, the unit name (curriculum vocabulary, not topic titles)
#           topic, the slug of the lesson that teaches it (omit = planned)
#           note, optional one-liner shown for planned units

areas:
  - slug: foundations
    title: Foundations of Probability
    description: The language of uncertainty; everything else in statistics is spoken in it.
    units:
      - title: Sample spaces and events
        topic: sample-spaces
      - title: The rules of probability
        topic: basic-probability
      - title: Conditional probability
        topic: conditional-probability
      - title: Independence
        topic: independence
      - title: Bayes' theorem
        topic: bayes-theorem
      - title: Base rates and false positives
        topic: base-rates
      - title: Random variables
        topic: random-variables
      - title: Expectation
        topic: expectation
      - title: Variance
        topic: variance
      - title: The law of large numbers
        topic: law-of-large-numbers
      - title: The central limit theorem
        topic: central-limit-theorem
      - title: Joint distributions and covariance
        note: How two variables move together, before correlation formalizes it.
      - title: The Monty Hall problem
        topic: monty-hall

  - slug: distributions
    title: Distributions
    description: The recurring shapes of randomness, and when each one is the right model.
    units:
      - title: Bernoulli
        topic: bernoulli-distribution
      - title: Binomial
        topic: binomial-distribution
      - title: Poisson
        topic: poisson-distribution
      - title: Normal
        topic: normal-distribution
      - title: Exponential
        topic: exponential-distribution
      - title: t
        topic: t-distribution
      - title: Chi-squared
        topic: chi-squared-distribution
      - title: F
        topic: f-distribution
      - title: Beta and gamma
        note: The shapes behind proportions and waiting times, and the conjugate-prior workhorses.

  - slug: estimation
    title: Estimation
    description: Turning a sample into a claim about the world, with the uncertainty attached.
    units:
      - title: Point estimation
        topic: point-estimation
      - title: Sampling distributions
        topic: sampling-distributions
      - title: Likelihood
        topic: likelihood
      - title: Maximum likelihood
        topic: maximum-likelihood-estimation
      - title: Confidence intervals
        topic: confidence-intervals
      - title: Bayesian inference
        topic: bayesian-inference
      - title: The bootstrap
        note: Uncertainty from the sample itself, by resampling; the Swiss army knife of estimation.

  - slug: testing
    title: Hypothesis Testing
    description: The machinery of claims and evidence, and the honesty it demands.
    units:
      - title: Hypothesis tests
        topic: hypothesis-testing
      - title: P-values
        topic: p-values
      - title: Statistical power
        topic: statistical-power
      - title: t-tests
        topic: t-tests
      - title: Effect sizes
        note: Difference versus importance; what significance never tells you.
      - title: Multiple comparisons
        note: Why running twenty tests guarantees a "discovery", and the corrections that fix it.
      - title: ANOVA
        note: Comparing several groups at once, with the F you already met.
      - title: The chi-squared test
        note: Testing independence in categorical tables, not just the distribution.
      - title: Nonparametric tests
        note: Tests that don't bet on a distribution.
      - title: Permutation tests
        note: Reshuffle, recompute, repeat; inference without formulas.

  - slug: modeling
    title: Regression and Modeling
    description: Describing how variables move together, and checking that the description deserves trust.
    units:
      - title: Correlation
        topic: correlation
      - title: Simple linear regression
        topic: simple-linear-regression
      - title: Multiple regression
        topic: multiple-regression
      - title: Model diagnostics
        topic: model-diagnostics
      - title: Logistic regression
        topic: logistic-regression
      - title: Regularization
        topic: regularization
      - title: Time series
        note: Data ordered in time breaks the assumptions; what changes and what survives.

  - slug: evaluation
    title: Model Evaluation and Learning
    description: Judging a model honestly, and the trade-offs every learner has to recognize.
    units:
      - title: Cross-validation
        topic: cross-validation
      - title: The bias-variance tradeoff
        topic: bias-variance-tradeoff
      - title: Classification metrics
        note: Accuracy lies; ROC, precision, recall, and the threshold you didn't notice choosing.
      - title: Decision trees and ensembles
        note: The models that aren't equations, and why they dominate applied work.
      - title: Clustering
        note: Finding structure without labels, and how to know if you found anything.
      - title: Dimensionality reduction
        note: PCA and friends; fewer variables, mostly the same story.
      - title: Imbalanced data
        note: When one class is 99% of the rows, the default playbook fails.

  - slug: practice
    title: Data Science Practice
    description: Working with real data, where the assumptions meet the mess.
    units:
      - title: Data wrangling
        topic: data-wrangling
      - title: Exploratory data analysis
        topic: exploratory-data-analysis
      - title: Missing data
        topic: missing-data
      - title: A/B testing
        topic: ab-testing
      - title: Feature engineering and leakage
        note: The pipeline mistake that makes a model look brilliant and deploy terribly.
      - title: Causal inference
        note: The step beyond "correlation is not causation", and how close you can get.
      - title: Experimental design
        note: Randomization, blocking, and pairing; the design choices that decide what your test can say.
      - title: Capstone, a messy analysis end to end
        note: A real dataset, a real question, and every shortcut the temptation offers.
